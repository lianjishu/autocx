<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>fontdec-test</title>
<style>
  body{font:13px/1.5 system-ui,sans-serif;margin:16px;color:#111}
  #log{white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px}
</style>
</head>
<body>
<h3>超星字体反混淆 · 浏览器内解码验证</h3>
<div id="log">loading…</div>
<script src="./fixture.js"></script>
<script>
'use strict';
const SIZE = 48;
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

const PC8 = (() => {
  const t = new Uint8Array(256);
  for (let i = 0; i < 256; i++) {
    let v = i, c = 0;
    while (v) { c += v & 1; v >>= 1; }
    t[i] = c;
  }
  return t;
})();

function popcnt32(v) {
  v = v - ((v >> 1) & 0x55555555);
  v = (v & 0x33333333) + ((v >> 2) & 0x33333333);
  return (((v + (v >> 4)) & 0x0F0F0F0F) * 0x01010101) >> 24;
}

// 48x48 bits (Uint8Array 2304, 0/1) -> Uint32Array(72) packed row-major
function packBits(bits) {
  const words = new Uint32Array(72);
  for (let i = 0; i < 2304; i++) {
    if (bits[i]) words[i >> 5] |= (1 << (i & 31));
  }
  return words;
}

// 48x48 -> 16x16 coarse (3x3 block, >=5 of 9)
function coarseOf(bits) {
  const words = new Uint32Array(8);
  for (let y = 0; y < 16; y++) {
    for (let x = 0; x < 16; x++) {
      let s = 0;
      for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 3; dx++) s += bits[(y * 3 + dy) * SIZE + (x * 3 + dx)];
      if (s >= 5) {
        const i = y * 16 + x;
        words[i >> 5] |= (1 << (i & 31));
      }
    }
  }
  return words;
}

function iou(a, b, nWords) {
  let inter = 0, uni = 0;
  for (let i = 0; i < nWords; i++) {
    const x = a[i], y = b[i];
    inter += popcnt32(x & y);
    uni += popcnt32(x | y);
  }
  return uni ? inter / uni : 0;
}

async function main() {
  const F = window.__FIXTURE;
  const t0 = performance.now();

  // ---- refs ----
  const refBytes = b64ToBytes(F.refs);
  const n = F.cps.length;
  const refFine = new Uint32Array(n * 72);
  const refCoarse = new Uint32Array(n * 8);
  const tmpBits = new Uint8Array(2304);
  for (let r = 0; r < n; r++) {
    const off = r * 288;
    for (let y = 0; y < SIZE; y++) {
      for (let bx = 0; bx < 6; bx++) {
        const byte = refBytes[off + y * 6 + bx];
        for (let k = 0; k < 8; k++) tmpBits[y * SIZE + bx * 8 + k] = (byte >> (7 - k)) & 1;
      }
    }
    refFine.set(packBits(tmpBits), r * 72);
    refCoarse.set(coarseOf(tmpBits), r * 8);
  }
  log(`refs ${n} 加载 ${(performance.now() - t0).toFixed(0)}ms`);

  // ---- font ----
  const ttf = b64ToBytes(F.ttf);
  const ff = new FontFace('cxsecret', `url(data:font/ttf;base64,${F.ttf})`);
  await ff.load();
  document.fonts.add(ff);
  await document.fonts.ready;
  log('FontFace ready: ' + ff.status);

  // ---- render helpers ----
  const big = document.createElement('canvas');
  big.width = 200; big.height = 200;
  const bctx = big.getContext('2d', { willReadFrequently: true });
  const small = document.createElement('canvas');
  small.width = SIZE; small.height = SIZE;
  const sctx = small.getContext('2d', { willReadFrequently: true });

  let px = 110;
  function renderBits(ch) {
    bctx.clearRect(0, 0, 200, 200);
    bctx.font = `${px}px cxsecret`;
    bctx.textBaseline = 'top';
    bctx.fillStyle = '#000';
    bctx.fillText(ch, 10, 10);
    const img = bctx.getImageData(0, 0, 200, 200).data;
    let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
    for (let y = 0; y < 200; y++) {
      for (let x = 0; x < 200; x++) {
        if (img[(y * 200 + x) * 4 + 3] > 127) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return null;
    const w = maxX - minX + 1, h = maxY - minY + 1;
    sctx.clearRect(0, 0, SIZE, SIZE);
    sctx.imageSmoothingEnabled = true;
    sctx.imageSmoothingQuality = 'high';
    sctx.drawImage(big, minX, minY, w, h, 0, 0, SIZE, SIZE);
    const d = sctx.getImageData(0, 0, SIZE, SIZE).data;
    const bits = new Uint8Array(2304);
    for (let i = 0; i < 2304; i++) bits[i] = d[i * 4 + 3] > 127 ? 1 : 0;
    return bits;
  }

  // ---- match: coarse topK -> fine ----
  const K = 100;
  function match(bits) {
    const qc = coarseOf(bits);
    const qf = packBits(bits);
    const cand = [];
    for (let r = 0; r < n; r++) {
      cand.push([iou(qc, refCoarse.subarray(r * 8, r * 8 + 8), 8), r]);
    }
    cand.sort((a, b) => b[0] - a[0]);
    let best = -1, bestScore = -1, second = -1;
    for (let i = 0; i < Math.min(K, cand.length); i++) {
      const r = cand[i][1];
      const s = iou(qf, refFine.subarray(r * 72, r * 72 + 72), 72);
      if (s > bestScore) { second = bestScore; bestScore = s; best = r; }
      else if (s > second) second = s;
    }
    return { cp: F.cps[best], score: bestScore, margin: bestScore - second, coarseTop: cand[0][0] };
  }

  // ---- run ----
  const rows = [];
  let ok = 0;
  const t1 = performance.now();
  for (const [cipher, expect] of F.pairs) {
    const bits = renderBits(cipher);
    if (!bits) { rows.push({ cipher, expect, got: null, err: 'render failed' }); continue; }
    const m = match(bits);
    const got = String.fromCodePoint(m.cp);
    if (got === expect) ok++;
    rows.push({ cipher, expect, got, score: +m.score.toFixed(3), margin: +m.margin.toFixed(3), coarse: +m.coarseTop.toFixed(2) });
  }
  const dt = performance.now() - t1;
  const acc = ok / rows.length;
  log(`\n用例 ${rows.length}，正确 ${ok}，准确率 ${(acc * 100).toFixed(1)}%，总耗时 ${dt.toFixed(0)}ms，单字 ${(dt / rows.length).toFixed(1)}ms`);
  const bad = rows.filter((r) => r.got !== r.expect);
  log('错例（前 15）: ' + JSON.stringify(bad.slice(0, 15), null, 0));

  window.__RESULT = {
    total: rows.length, ok, acc: +acc.toFixed(4), msPerChar: +(dt / rows.length).toFixed(2),
    refs: n, bad: bad.slice(0, 40), rows,
  };
  log('\nDONE');
  document.title = `fontdec acc=${(acc * 100).toFixed(1)}%`;
}

main().catch((e) => {
  window.__RESULT = { error: String(e && e.stack || e) };
  document.getElementById('log').textContent += '\nERROR ' + (e && e.stack || e);
  document.title = 'fontdec ERROR';
});
</script>
</body>
</html>
