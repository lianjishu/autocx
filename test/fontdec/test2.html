<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>fontdec-size-test</title>
<style>body{font:13px/1.5 system-ui,sans-serif;margin:16px;color:#111}#log{white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px}</style>
</head>
<body>
<h3>参考位图尺寸 vs 准确率（同一批 95 个字）</h3>
<div id="log">loading…</div>
<script src="./fixture.js"></script>
<script>
'use strict';
const S48 = 48;
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
function b64ToBytes(b64){const b=atob(b64);const o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;}
function popcnt32(v){v=v-((v>>1)&0x55555555);v=(v&0x33333333)+((v>>2)&0x33333333);return(((v+(v>>4))&0x0F0F0F0F)*0x01010101)>>24;}
function packBits(bits){const n=bits.length;const words=new Uint32Array(Math.ceil(n/32));for(let i=0;i<n;i++){if(bits[i])words[i>>5]|=(1<<(i&31));}return words;}
function iou(a,b,nw){let inter=0,uni=0;for(let i=0;i<nw;i++){const x=a[i],y=b[i];inter+=popcnt32(x&y);uni+=popcnt32(x|y);}return uni?inter/uni:0;}

// 48x48 -> N x N 双线性 + 0.5 阈值
function resample(bits, N) {
  const out = new Uint8Array(N * N);
  const s = S48 / N;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const fy = (i + 0.5) * s - 0.5, fx = (j + 0.5) * s - 0.5;
      const y0 = Math.max(0, Math.floor(fy)), x0 = Math.max(0, Math.floor(fx));
      const y1 = Math.min(S48 - 1, y0 + 1), x1 = Math.min(S48 - 1, x0 + 1);
      const wy = fy - y0, wx = fx - x0;
      const v = bits[y0 * S48 + x0] * (1 - wy) * (1 - wx) + bits[y0 * S48 + x1] * (1 - wy) * wx +
                bits[y1 * S48 + x0] * wy * (1 - wx) + bits[y1 * S48 + x1] * wy * wx;
      out[i * N + j] = v >= 0.5 ? 1 : 0;
    }
  }
  return out;
}

function coarse16(bits48) {
  const words = new Uint32Array(8);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    let sum = 0;
    for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 3; dx++) sum += bits48[(y * 3 + dy) * S48 + (x * 3 + dx)];
    if (sum >= 5) { const i = y * 16 + x; words[i >> 5] |= (1 << (i & 31)); }
  }
  return words;
}

async function main() {
  const F = window.__FIXTURE;
  const n = F.cps.length;
  const refBytes = b64ToBytes(F.refs);
  const refBits48 = new Uint8Array(n * 2304);
  for (let r = 0; r < n; r++) {
    const off = r * 288;
    for (let y = 0; y < S48; y++) for (let bx = 0; bx < 6; bx++) {
      const byte = refBytes[off + y * 6 + bx];
      for (let k = 0; k < 8; k++) refBits48[r * 2304 + y * S48 + bx * 8 + k] = (byte >> (7 - k)) & 1;
    }
  }
  const refCoarse = new Uint32Array(n * 8);
  for (let r = 0; r < n; r++) refCoarse.set(coarse16(refBits48.subarray(r * 2304, (r + 1) * 2304)), r * 8);

  const ff = new FontFace('cxsecret', `url(data:font/ttf;base64,${F.ttf})`);
  await ff.load(); document.fonts.add(ff); await document.fonts.ready;
  log('font ready');

  const big = document.createElement('canvas'); big.width = big.height = 200;
  const bctx = big.getContext('2d', { willReadFrequently: true });
  const sm = document.createElement('canvas'); sm.width = sm.height = S48;
  const sctx = sm.getContext('2d', { willReadFrequently: true });

  function render48(ch) {
    bctx.clearRect(0, 0, 200, 200);
    bctx.font = '110px cxsecret'; bctx.textBaseline = 'top'; bctx.fillStyle = '#000';
    bctx.fillText(ch, 10, 10);
    const img = bctx.getImageData(0, 0, 200, 200).data;
    let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
    for (let y = 0; y < 200; y++) for (let x = 0; x < 200; x++) if (img[(y * 200 + x) * 4 + 3] > 127) {
      if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
    if (maxX < 0) return null;
    sctx.clearRect(0, 0, S48, S48);
    sctx.imageSmoothingQuality = 'high';
    sctx.drawImage(big, minX, minY, maxX - minX + 1, maxY - minY + 1, 0, 0, S48, S48);
    const d = sctx.getImageData(0, 0, S48, S48).data;
    const bits = new Uint8Array(2304);
    for (let i = 0; i < 2304; i++) bits[i] = d[i * 4 + 3] > 127 ? 1 : 0;
    return bits;
  }

  const sizes = [48, 32, 24, 20];
  const results = {};
  for (const N of sizes) {
    const nw = Math.ceil((N * N) / 32);
    const refFine = new Uint32Array(n * nw);
    const t0 = performance.now();
    for (let r = 0; r < n; r++) {
      const b = N === 48 ? refBits48.subarray(r * 2304, (r + 1) * 2304) : resample(refBits48.subarray(r * 2304, (r + 1) * 2304), N);
      refFine.set(packBits(b), r * nw);
    }
    const prepMs = performance.now() - t0;
    let ok = 0; const bad = [];
    const t1 = performance.now();
    for (const [cipher, expect] of F.pairs) {
      const b48 = render48(cipher);
      if (!b48) continue;
      const b = N === 48 ? b48 : resample(b48, N);
      const qc = coarse16(b48);
      const qf = packBits(b);
      const cand = [];
      for (let r = 0; r < n; r++) cand.push([iou(qc, refCoarse.subarray(r * 8, r * 8 + 8), 8), r]);
      cand.sort((a, b2) => b2[0] - a[0]);
      let best = -1, bs = -1, second = -1;
      for (let i = 0; i < Math.min(100, cand.length); i++) {
        const r = cand[i][1];
        const s = iou(qf, refFine.subarray(r * nw, (r + 1) * nw), nw);
        if (s > bs) { second = bs; bs = s; best = r; } else if (s > second) second = s;
      }
      const got = String.fromCodePoint(F.cps[best]);
      if (got === expect) ok++; else bad.push([cipher, expect, got, +bs.toFixed(3), +(bs - second).toFixed(3)]);
    }
    const dt = performance.now() - t1;
    results[N] = { acc: +(ok / F.pairs.length).toFixed(4), ok, total: F.pairs.length, msPerChar: +(dt / F.pairs.length).toFixed(2), prepMs: +prepMs.toFixed(0), bytesPerRef: Math.ceil(N * N / 8), bad: bad.slice(0, 6) };
    log(`N=${N}: acc ${(ok / F.pairs.length * 100).toFixed(1)}%  单字 ${(dt / F.pairs.length).toFixed(2)}ms  建库 ${prepMs.toFixed(0)}ms  每字 ${results[N].bytesPerRef}B  错例 ${JSON.stringify(bad.slice(0, 4))}`);
  }
  window.__RESULT = { refs: n, results };
  log('DONE');
  document.title = 'fontdec-size DONE';
}
main().catch(e => { window.__RESULT = { error: String(e.stack || e) }; log('ERROR ' + e); });
</script>
</body>
</html>
